[package]
name = "dex-bytecode"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "dex_bytecode"
path = "src/lib.rs"

[features]
default = []
cli = ["dep:clap", "dep:colored", "dep:simple_logger"]

[dependencies]
log = "0.4.21"
simple_logger = { version = "5.0.0", optional = true }
clap = { version = "4.5.4", features = ["derive"], optional = true }
colored = { version = "2.1", optional = true }
