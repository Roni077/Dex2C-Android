[package]
name = "apkparser"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "APK parser - Rust port of apkparser (signature, zip, utils, permissions, manifest)"

[features]
default = []
sign-pure = ["dep:rsa", "dep:p256", "dep:ecdsa", "dep:pkcs7"]
cli = ["dep:clap"]

[dependencies]
byteorder = "1.5"
thiserror = "1.0"
memchr = "2"
crc32fast = "1.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
x509-parser = "0.16"
der = "0.7"
pkcs7 = { version = "0.4", optional = true }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
clap = { version = "4.4", features = ["derive"], optional = true }
hex = "0.4"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"], optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
ecdsa = { version = "0.16", features = ["signing"], optional = true }

[dev-dependencies]
hex = "0.4"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
