[package]
name = "dex-decompiler"
version = "0.1.0"
edition = "2021"
description = "DEX to Java decompiler in pure Rust"
license = "Apache-2.0"

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
dex-bytecode = { path = "../dex-bytecode" }
dex-parser = { path = "../dex-parser" }
thiserror = "1.0"
rayon = { version = "1.10", optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "dex_decompiler"
path = "src/lib.rs"
