[workspace]
members = [
    "crates/dex2c-core",
    "crates/dex2c-dex",
    "crates/dex2c-smali",
    "crates/dex2c-transpiler",
    "crates/dex2c-toolchain",
    "crates/dex2c-editor",
    "vendor/dex-bytecode",
    "vendor/dex-parser",
    "vendor/axml-parser",
    "vendor/apk-parser",
    "vendor/dex-decompiler",
]

[workspace.dependencies]
dex-bytecode = { path = "vendor/dex-bytecode", default-features = false }
dex-parser = { path = "vendor/dex-parser", default-features = false }
axml-parser = { path = "vendor/axml-parser", default-features = false }
apkparser = { path = "vendor/apk-parser", default-features = false, features = ["sign-pure"] }
dex-decompiler = { path = "vendor/dex-decompiler", default-features = false }

[package]
name = "rust_dex2c"
version = "0.2.0"
edition = "2021"
authors = ["Dex2C Studio Team"]
description = "High-performance Rust native backend engine for Dex2C Studio"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dex2c-core = { path = "crates/dex2c-core" }
dex2c-dex = { path = "crates/dex2c-dex" }
dex2c-smali = { path = "crates/dex2c-smali" }
dex2c-transpiler = { path = "crates/dex2c-transpiler" }
dex2c-toolchain = { path = "crates/dex2c-toolchain" }
dex2c-editor = { path = "crates/dex2c-editor" }
dex-parser = { workspace = true }
dex-bytecode = { workspace = true }
axml-parser = { workspace = true }
apkparser = { workspace = true }
dex-decompiler = { workspace = true }
jni = { version = "0.21", default-features = false }
regex = { version = "1.10", default-features = false, features = ["std", "perf"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
debug = true
